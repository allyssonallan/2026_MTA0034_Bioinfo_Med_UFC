project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "tutoriais/*.qmd"
    - "!aulas/modelo_aula.qmd"
    - "!tutoriais/modelo_tutorial.qmd"
  resources:
    - recursos/**
    - scripts/**

website:
  title: "MTA0034 · Bioinformática aplicada à medicina"
  description: "Disciplina do Programa de Pós-Graduação em Medicina Translacional da Universidade Federal do Ceará"
  site-url: "https://allyssonallan.github.io/2026_MTA0034_Bioinfo_Med_UFC/"
  repo-url: "https://github.com/allyssonallan/2026_MTA0034_Bioinfo_Med_UFC"
  repo-actions: [edit, source, issue]
  favicon: assets/logos/ufc-favicon.png
  navbar:
    pinned: true
    background: "#ffffff"
    foreground: "#17324d"
    left:
      - text: "Início"
        href: index.qmd
      - text: "Programa"
        href: programa.qmd
      - text: "Tutoriais"
        href: tutoriais/index.qmd
      - text: "Avaliação"
        href: avaliacao.qmd
    right:
      - icon: github
        href: "https://github.com/allyssonallan/2026_MTA0034_Bioinfo_Med_UFC"
        aria-label: GitHub
  page-footer:
    left: "MTA0034 · PPG Medicina Translacional · UFC"
    right: "2026.2 · Fortaleza, Ceará"
  search:
    location: navbar
    type: overlay

format:
  html:
    theme: default
    css: assets/css/styles.css
    toc: true
    toc-depth: 3
    smooth-scroll: true
    code-copy: true
    code-overflow: wrap
    link-external-newwindow: true
    anchor-sections: true
    include-after-body: assets/js/site-footer.html

execute:
  freeze: auto

lang: pt-BR
